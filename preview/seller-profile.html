<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Profile — KanoGadgets.com</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' rx='22' fill='%230A0F1C'/&gt;&lt;text x='50' y='68' font-family='Montserrat,Arial' font-size='58' font-weight='800' text-anchor='middle' fill='%23007BFF'&gt;K&lt;/text&gt;&lt;text x='62' y='68' font-family='Montserrat,Arial' font-size='58' font-weight='800' text-anchor='middle' fill='white'&gt;G&lt;/text&gt;&lt;/svg&gt;">
<style>
/* self-hosted fonts — crisp on every device, no CDN dependency */
@font-face{font-family:'Montserrat';font-style:normal;font-weight:500;font-display:swap;src:url('static/fonts/montserrat-500.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url('static/fonts/montserrat-600.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url('static/fonts/montserrat-700.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:800;font-display:swap;src:url('static/fonts/montserrat-800.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:900;font-display:swap;src:url('static/fonts/montserrat-900.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('static/fonts/inter-400.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url('static/fonts/inter-500.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('static/fonts/inter-600.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url('static/fonts/inter-700.woff2') format('woff2')}
body,button,input,select,textarea{
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  font-feature-settings:"cv02","cv03","cv04","cv11";   /* modern Inter letterforms */
}

/* ============ SELLER TIER — dark navy sidebar + white content cards + blue #007BFF (reference: Seller sheet) ============ */
:root{
  --blue:#007BFF; --blue2:#3B82F6; --navy:#0A0F1C; --navy2:#0D1526;
  --line:#1F2C44; --green:#22C55E; --amber:#FFB020; --red:#FF5A6A;
  --font-h:'Montserrat',Inter,system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif;
  --r:14px; --card:#FFFFFF; --cardtxt:#0F172A; --cardmuted:#64748B; --cardline:#E5E7EB;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-b);background:var(--navy);color:#D6DFEF;line-height:1.55;
  background:radial-gradient(900px 480px at 100% -10%,#12203f 0%,transparent 55%),var(--navy)}
a{color:inherit;text-decoration:none}
.muted{color:#8FA0BB}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 16px;font:600 13px var(--font-h);
  cursor:pointer;border:1px solid var(--line);background:#101A2E;color:#D6DFEF;transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:#fff}
.btn-primary{background:linear-gradient(120deg,var(--blue),var(--blue2));border:none;color:#fff;box-shadow:0 8px 22px -8px rgba(0,123,255,.55)}
.btn-wa{background:linear-gradient(120deg,#16A34A,#22C55E);border:none;color:#fff}
.btn-danger{background:linear-gradient(120deg,#FF4757,#FF5A6A);border:none;color:#fff}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-sm{padding:6px 11px;font-size:12px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 22px;background:var(--navy);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-h);color:#fff}
.brand .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#007BFF,#3B82F6);display:grid;place-items:center;font-size:14px;font-weight:900;box-shadow:0 4px 16px -4px rgba(0,123,255,.6)}
.brand .wm b{color:var(--blue)}
.userchip{display:flex;align-items:center;gap:8px;color:#9FB2CF;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;font:800 13px var(--font-h)}

/* shell */
.dash-shell{display:flex;min-height:calc(100vh - 58px)}
.dash-nav{width:236px;flex-shrink:0;background:var(--navy2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.dash-nav h3{font:800 11px var(--font-h);color:#5B718F;text-transform:uppercase;letter-spacing:.12em;margin:14px 10px 6px}
.dash-nav a{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;font:600 13.5px var(--font-b);color:#9FB2CF;transition:.15s}
.dash-nav a:hover{background:rgba(0,123,255,.08);color:#fff}
.dash-nav a.active{background:linear-gradient(120deg,rgba(0,123,255,.22),rgba(59,130,246,.14));color:#fff;border-left:3px solid var(--blue)}
.dash-nav .ico{width:18px;text-align:center}
.dash-bottom{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.dash-body{flex:1;padding:26px;background:#0B1220}
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.dash-header h1{margin:0;font:800 24px var(--font-h);color:#fff}

/* white cards (reference: seller sheet panels) */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:var(--card);color:var(--cardtxt);border:none;border-radius:var(--r);padding:18px;box-shadow:0 10px 26px -16px rgba(2,8,23,.7)}
.stat-card .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px;font-size:18px}
.stat-card .num{font:800 26px var(--font-h);color:#0F172A}
.stat-card .lbl{font:600 12px var(--font-h);color:var(--cardmuted);margin-top:2px}
.table-card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 10px 26px -16px rgba(2,8,23,.7)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;color:var(--cardtxt)}
.tbl th{background:#F1F5FB;text-align:left;padding:11px 14px;font:700 11px var(--font-h);letter-spacing:.08em;text-transform:uppercase;color:#64748B;border-bottom:1px solid var(--cardline)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--cardline);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl strong{color:#0F172A}
.tbl .muted{color:#94A3B8}
.tbl a{color:var(--blue)}

/* forms on white card */
.form-card{background:var(--card);color:var(--cardtxt);border-radius:var(--r);padding:24px;max-width:640px}
.form-card h3{margin:0 0 14px;font:700 15px var(--font-h);color:#0F172A}
.field{margin-bottom:15px}
.field label{display:block;font:600 12.5px var(--font-h);margin-bottom:6px;color:#334155}
.field input,.field select,.field textarea{width:100%;background:#F8FAFD;border:1px solid var(--cardline);border-radius:10px;color:#0F172A;padding:11px 13px;font-size:14px;outline:none;font-family:var(--font-b);transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,123,255,.12)}
.field small{display:block;color:#94A3B8;font-size:11.5px;margin-top:5px}
.up-panel{border:2px dashed #CBD5E1;border-radius:12px;padding:22px;text-align:center;color:#64748B;font-size:13px;cursor:pointer;transition:.18s;display:block}
.up-panel:hover{border-color:var(--blue);color:var(--blue);background:rgba(0,123,255,.05)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:14px 0}
.g-item{position:relative;border-radius:10px;overflow:hidden;background:#0B1220;border:1px solid var(--cardline)}
.g-item img{width:100%;height:100px;object-fit:cover;display:block}
.g-item.main{border:2px solid var(--blue)}

/* badges stay colored on light bg */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:700 11px var(--font-h)}
.badge.published,.badge.active{background:rgba(34,197,94,.15);color:#15803D}
.badge.draft,.badge.pending{background:rgba(255,176,32,.15);color:#B45309}
.badge.removed,.badge.suspended{background:rgba(255,90,106,.15);color:#BE123C}
.badge:hover{text-decoration:none}

/* flashes */
.flash-wrap{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(560px,92vw)}
.flash{background:#101A2E;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:12px 18px;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.4);transition:.3s}
.flash.err{border-left-color:var(--red)}

@media(max-width:860px){
  .dash-shell{flex-direction:column}
  .dash-nav{width:100%;flex-direction:row;overflow:auto;border-right:none;border-bottom:1px solid var(--line)}
  .dash-nav h3{display:none}.dash-body{padding:16px}
  .two-col{grid-template-columns:1fr!important}
}
</style>
</head>
<body>

  


<div class="topbar">
  <a class="brand" href="public.html"><span class="mk">KG</span><span class="wm">Kano<b>Gadgets</b>.com · Seller</span></a>
  <div class="userchip">
    <span class="avatar">P</span>
    <span>Preview Shop</span>
    <a class="btn btn-ghost btn-sm" href="public.html">View store</a>
  </div>
</div>

<div class="dash-shell">
  <nav class="dash-nav">
    <h3>Seller</h3>
    <a href="seller.html" class=""><span class="ico">⌂</span>Dashboard</a>
    <a href="seller-products.html" class=""><span class="ico">📱</span>My Products</a>
    <a href="seller-add.html" class=""><span class="ico">＋</span>Add Product</a>
    <h3>Shop</h3>
    <a href="seller-profile.html" class="active"><span class="ico">🏬</span>Profile &amp; Shop</a>
    <a href="seller-rules.html" class=""><span class="ico">📜</span>Seller Rules</a>
    <a href="seller-support.html" class=""><span class="ico">💬</span>Help &amp; Support</a>
    <div class="dash-bottom"><a href="/logout"><span class="ico">⎋</span>Log Out</a></div>
  </nav>
  <main class="dash-body">
    
<div class="dash-header" style="margin-bottom:24px"><h1>Profile &amp; Shop Settings</h1></div>

<div class="form-card" style="max-width:560px">
  <form method="post">
    <div class="field"><label>Your display name *</label><input name="display_name" value="Preview Shop" required=""></div>
    <div class="field"><label>Shop name *</label><input name="shop_name" value="Preview Shop Kano" required=""></div>
    <div class="field"><label>Shop location *</label><input name="location" value="Kano Gadget Center" required=""></div>
    <div class="field"><label>WhatsApp number *</label><input name="whatsapp" value="2348031234567" required="">
      <small>Customers will chat with you on this number.</small></div>
    <div class="field"><label>Contact email</label><input name="contact_email" type="email" value="preview@shop.ng"></div>
    <div class="field"><label>Shop description</label>
      <textarea name="shop_description" rows="4" placeholder="Tell customers about your shop, specials and service."></textarea>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center">Save Shop Profile</button>
  </form>
</div>

  </main>
</div>
<script>document.querySelectorAll('.flash').forEach(el=>setTimeout(()=>{el.style.opacity=0;el.style.transform='translateY(-4px)'},4500))</script>

<script>
      document.addEventListener('click', e => {
        const a = e.target.closest('a[href^="/"]');
        if (a) { e.preventDefault(); note(); }
      });
      document.addEventListener('submit', e => { e.preventDefault(); note(); });
      function note(){
        let t = document.getElementById('kg-toast');
        if(!t){ t=document.createElement('div'); t.id='kg-toast';
          t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#13203C;color:#fff;border:1px solid rgba(120,165,255,.3);border-radius:12px;padding:12px 20px;font:13px system-ui;z-index:9999;box-shadow:0 12px 30px rgba(0,0,0,.5);transition:.3s';
          t.textContent='Static preview — run the live app to use actions (login, publish, approve…)'; document.body.appendChild(t);}
        t.style.opacity=1; clearTimeout(window.__kgt); window.__kgt=setTimeout(()=>t.style.opacity=0,2600);
      }
    </script></body></html>
