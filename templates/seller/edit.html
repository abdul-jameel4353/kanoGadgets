{% extends "seller/base.html" %}
{% block title %}Edit Product — KanoGadgets.com{% endblock %}
{% block content %}
<div class="dash-header" style="margin-bottom:20px">
  <div>
    <h1>Edit Product</h1>
    <a href="{{ url_for('product_page', pid=p.id) }}" target="_blank" class="muted" style="font-size:13px">View live listing →</a>
  </div>
</div>

<div class="form-card" style="max-width:680px">
  <form method="post" enctype="multipart/form-data">
    <div class="field"><label>Product name *</label><input name="name" value="{{ p.name }}" required></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="field"><label>Brand</label><input name="brand" value="{{ p.brand or '' }}"></div>
      <div class="field"><label>Model</label><input name="model" value="{{ p.model or '' }}"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="field"><label>Category *</label>
        <select name="category_id" required>
          {% for c in cats %}<option value="{{ c.id }}" {% if p.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="field"><label>Condition *</label>
        <select name="condition" required>
          <option {% if p.condition=='New' %}selected{% endif %}>New</option>
          <option {% if p.condition=='Used' %}selected{% endif %}>Used</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Price (₦) *</label><input name="price" type="number" min="1" value="{{ p.price }}" required></div>
    <div class="field"><label>Availability</label>
      <select name="availability">
        <option {% if p.availability=='In stock' %}selected{% endif %}>In stock</option>
        <option {% if p.availability=='Limited' %}selected{% endif %}>Limited</option>
        <option {% if p.availability=='Out of stock' %}selected{% endif %}>Out of stock</option>
      </select>
    </div>
    <div class="field"><label>WhatsApp number *</label><input name="whatsapp" value="{{ p.whatsapp or '' }}" required></div>
    <div class="field"><label>Location *</label><input name="location" value="{{ p.location or '' }}" required></div>
    <div class="field"><label>Description *</label><textarea name="description" rows="6" required>{{ p.description }}</textarea></div>

    <div class="field"><label>Current photos</label>
      <div class="gallery">
        {% for im in imgs %}
        <div class="g-item {% if im.is_main %}main{% endif %}">
          <img src="{{ url_for('uploads', fn=im.file) }}">
          {% if im.is_main %}<span style="position:absolute;top:6px;left:6px;background:rgba(0,123,255,.9);color:#fff;font:700 9.5px var(--font-h);
             padding:2px 6px;border-radius:4px">MAIN</span>{% endif %}
        </div>
        {% endfor %}
      </div>
    </div>
    <div class="field"><label>Add more photos</label>
      <label class="up-panel"><input type="file" name="images" accept=".jpg,.jpeg,.png,.webp" multiple hidden>
        ＋ Upload additional images</label>
    </div>

    <div style="display:flex;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)">
      <a href="{{ url_for('seller_products') }}" class="btn btn-ghost">Cancel</a>
      <button class="btn btn-primary" style="flex:1;justify-content:center">Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
